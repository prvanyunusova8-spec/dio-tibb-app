<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DİO-TİBB Köməkçisi</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; padding: 20px; text-align: center; }
        .card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { color: #0088cc; }
        button { background: #0088cc; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 16px; width: 100%; cursor: pointer; }
    </style>
</head>
<body>
    <h2>👨‍⚕️ DİO-TİBB Tətbiqi</h2>
    <div class="card">
        <h3>🫀 Anatomiya</h3>
        <p>Bədən üzvləri haqqında məlumatlar.</p>
    </div>
    <div class="card">
        <h3>🚨 Təcili Yardım</h3>
        <p>Təcili hallar üçün təlimatlar.</p>
    </div>
    <button onclick="Telegram.WebApp.close()">Tətbiqdən Çıx</button>
</body>
</html>
